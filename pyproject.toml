[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astropanel"
version = "0.1.2"
description = "Widget Windows para astronomia observacional"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "astral>=3.2",
  "astropy>=6.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
astropanel = "astropanel.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astropanel = ["resources/*.html", "resources/*.json", "resources/*.svg", "resources/*.md", "resources/*.png", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
